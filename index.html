<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>镜流·AI 创作画布原型</title>
  <style>
    :root{--bg:#0b0d12;--panel:#141720;--panel2:#1b1f2a;--line:#2a3040;--text:#f6f7fb;--muted:#8992a8;--accent:#7c5cff;--accent2:#34d6b6;--danger:#ff6577;--shadow:0 18px 50px #0008;--radius:18px}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{color:inherit}
    #app{height:100%;display:grid;grid-template-columns:256px 1fr 300px;grid-template-rows:64px 1fr;grid-template-areas:"top top top" "left canvas right";transition:.2s}
    .topbar{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);z-index:30}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em}.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 26px color-mix(in srgb,var(--accent) 55%,transparent)}
    .project-select{width:180px;padding:8px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px}.project-name{border:0;background:transparent;color:var(--text);font-weight:650;width:210px;padding:8px;border-radius:8px}.project-name:hover,.project-name:focus{background:var(--panel2);outline:none}.spacer{flex:1}.save-state{font-size:12px;color:var(--muted)}
    .btn,.tool{border:1px solid var(--line);background:var(--panel2);padding:9px 12px;border-radius:11px;cursor:pointer;transition:.15s}.btn:hover,.tool:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--danger)}
    .left{grid-area:left;background:var(--panel);border-right:1px solid var(--line);padding:18px;overflow:auto;z-index:20}.right{grid-area:right;background:var(--panel);border-left:1px solid var(--line);padding:18px;overflow:auto;z-index:20}.canvas-shell{grid-area:canvas;position:relative;overflow:hidden;background:var(--bg)}
    h3{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin:6px 0 14px}p{color:var(--muted);font-size:13px;line-height:1.6}
    .node-tools{display:grid;gap:9px}.node-tool{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px;cursor:pointer}.node-tool:hover{border-color:var(--accent)}.node-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:var(--accent);font-weight:800}.hint{margin-top:18px;padding:12px;border:1px dashed var(--line);border-radius:12px}
    #viewport{position:absolute;inset:0;cursor:grab;background-image:radial-gradient(circle,color-mix(in srgb,var(--muted) 24%,transparent) 1px,transparent 1px);background-size:24px 24px;background-position:var(--grid-x,0) var(--grid-y,0)}#viewport.panning{cursor:grabbing}
    #world{position:absolute;left:0;top:0;width:4000px;height:3000px;transform-origin:0 0}#edges{position:absolute;inset:0;width:4000px;height:3000px;overflow:visible;pointer-events:auto}.edge{fill:none;stroke:color-mix(in srgb,var(--accent) 78%,white);stroke-width:3;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--accent) 50%,transparent));pointer-events:none;transition:stroke .12s,stroke-width .12s}.edge.preview{stroke:var(--accent2);stroke-dasharray:9 7;filter:none}.edge-hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke;cursor:not-allowed}.edge-group:hover .edge{stroke:var(--danger);stroke-width:5;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--danger) 70%,transparent))}
    .node{position:absolute;z-index:1;isolation:isolate;width:260px;height:150px;min-width:180px;min-height:120px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 96%,transparent);border-radius:var(--radius);box-shadow:var(--shadow);overflow:visible;user-select:none;transition:border-color .12s,box-shadow .12s}.node .node-body{height:calc(100% - 44px);overflow:hidden}.node.type-video-generator .node-body p{height:100%;margin:0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;white-space:pre-wrap;overflow-wrap:anywhere}.node.selected{z-index:10;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent),var(--shadow)}.node.running{z-index:9;border-color:var(--accent2)}
    .node-head{height:44px;display:flex;align-items:center;gap:9px;padding:0 13px;border-bottom:1px solid var(--line);cursor:move;font-weight:700;font-size:13px}.node-head .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}.node-type{margin-left:auto;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.node-body{padding:13px}.node-body textarea{height:100%;resize:none}.node-preview{height:110px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--panel2)),color-mix(in srgb,var(--accent2) 24%,var(--panel2)));display:grid;place-items:center;color:var(--muted);font-size:12px;overflow:hidden}.type-image .node-body{display:flex;flex-direction:column}.node-preview.image-copy{height:auto!important;min-height:0;flex:1;cursor:copy;position:relative;background:var(--panel2)}.node-preview.image-copy:hover::after{content:'点击复制图片';position:absolute;inset:auto 8px 8px;padding:6px 8px;border-radius:8px;background:#000b;color:#fff;text-align:center}.node-preview img,.node-preview video{width:100%;height:100%;object-fit:cover}.node-preview.image-copy img{display:block;width:100%;height:100%;object-fit:contain}.image-replace{flex:0 0 auto;width:100%;margin-top:9px}.generate{width:100%;margin-top:10px}.port{position:absolute;top:calc(50% - 13px);width:26px;height:26px;border-radius:50%;border:4px solid var(--panel);background:var(--muted);cursor:crosshair;z-index:6;transition:.15s;transform:scale(var(--port-scale,1))}.port::before{content:'';position:absolute;inset:-14px;border-radius:50%}.port:hover{transform:scale(calc(var(--port-scale,1) * 1.18));box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 18%,transparent)}.port.in{left:-13px}.port.out{right:-13px;background:var(--accent)}.resize-handle{position:absolute;z-index:8}.resize-handle.resize-width{top:18px;right:-6px;width:12px;height:calc(100% - 36px);cursor:ew-resize}.resize-handle.resize-height{left:18px;bottom:-6px;width:calc(100% - 36px);height:12px;cursor:ns-resize}.resize-handle.resize-both{right:-7px;bottom:-7px;width:18px;height:18px;border-radius:50%;cursor:nwse-resize;background:var(--accent);border:4px solid var(--panel);opacity:0;transition:opacity .12s}.node:hover .resize-handle.resize-both,.node.selected .resize-handle.resize-both{opacity:1}
    .video-prompt-wrap{position:relative}.video-prompt{min-height:180px;line-height:1.65}.mention-menu{display:none;position:absolute;z-index:45;left:0;right:0;top:calc(100% + 6px);padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.mention-menu.open{display:grid;gap:4px}.mention-option{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--text);padding:8px;border-radius:8px;text-align:left;cursor:pointer}.mention-option:hover,.mention-option.active{background:var(--panel2)}.mention-thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;background:var(--panel2)}.mention-meta{display:grid;gap:2px}.mention-meta small,.reference-help{color:var(--muted)}.reference-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}.reference-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);font-size:11px;color:var(--muted)}.reference-chip strong{color:var(--accent2)}.no-reference{padding:8px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:11px;margin-bottom:9px}.video-settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.video-settings label{margin:0}.doubao-note{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:11px;color:var(--muted);line-height:1.5}.generate-doubao{display:block;width:100%;padding:12px;text-align:center;text-decoration:none}
    .canvas-controls{position:absolute;right:18px;bottom:78px;z-index:12;display:flex;gap:6px;padding:6px;border:1px solid var(--line);background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}.zoom-label{min-width:54px;text-align:center;padding:8px;color:var(--muted);font-size:12px}.minimap{position:absolute;right:18px;bottom:128px;width:180px;height:100px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:12px;z-index:11;overflow:hidden;opacity:.86}.mini-node{position:absolute;background:var(--accent);border-radius:2px}
    label{display:grid;gap:7px;color:var(--muted);font-size:12px;margin-bottom:14px}input,textarea,select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:90px}.row{display:flex;gap:8px}.row>*{flex:1}.inspector-empty{height:70%;display:grid;place-items:center;text-align:center;color:var(--muted)}
    .prototype-badge{position:fixed;left:16px;bottom:18px;z-index:99;color:var(--muted);font-size:11px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:99px}.right.hidden{display:none}#app.inspector-hidden{grid-template-columns:280px 1fr}
    .toast{position:fixed;top:78px;left:50%;z-index:80;transform:translate(-50%,-20px);opacity:0;padding:10px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .context-menu{display:none;position:fixed;z-index:120;min-width:210px;padding:7px;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.context-menu.open{display:grid;gap:3px}.context-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.context-menu button:hover:not(:disabled){background:var(--panel2)}.context-menu button:disabled{opacity:.38;cursor:default}.context-menu .menu-icon{width:20px;text-align:center;color:var(--accent)}.context-menu kbd{margin-left:auto;color:var(--muted);font-size:10px}.context-menu hr{width:100%;border:0;border-top:1px solid var(--line);margin:4px 0}.context-menu .danger-item{color:var(--danger)}
    .edge-delete-hint{display:none;position:fixed;z-index:110;padding:6px 9px;border-radius:8px;background:var(--danger);color:#fff;font-size:11px;box-shadow:0 8px 24px #0008;pointer-events:none}.edge-delete-hint.show{display:block}
    .copy-fallback{display:none;position:fixed;inset:0;z-index:140;background:#0009;place-items:center;padding:24px}.copy-fallback.open{display:grid}.copy-fallback-card{width:min(620px,100%);padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow)}.copy-fallback textarea{min-height:260px;margin:10px 0}.copy-fallback-actions{display:flex;justify-content:flex-end;gap:8px}
    @media(max-width:900px){#app,#app.inspector-hidden{grid-template-columns:72px 1fr;grid-template-rows:60px 1fr;grid-template-areas:"top top" "left canvas"}.right{display:none}.left{padding:10px}.left h3,.left p,.node-tool span:last-child{display:none}.node-tool{justify-content:center;padding:12px}.topbar .desktop-only{display:none}.project-name{width:120px}.prototype-badge{display:none}}
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="logo"></span><span class="desktop-only">镜流 Canvas</span></div>
      <select id="projectSelect" class="project-select" aria-label="选择当前项目"></select>
      <button class="btn" id="newProjectBtn" type="button">＋ 新建项目</button>
      <input id="projectName" class="project-name" value="爱弥斯·现实约会" aria-label="项目名" />
      <span id="saveState" class="save-state">正在读取项目文件…</span>
      <span class="spacer"></span>
      <button class="btn desktop-only" id="importBtn">导入</button>
      <button class="btn desktop-only" id="exportBtn">导出 JSON</button>
      <button class="btn primary" id="runBtn">▶ 运行画布</button>
      <input id="fileInput" type="file" accept="application/json" hidden />
      <input id="imageFileInput" type="file" accept="image/*" hidden />
    </header>
    <aside class="left">
      <h3>节点库</h3>
      <div class="node-tools">
        <button class="node-tool" data-add="text"><span class="node-icon">T</span><span>文本 / 提示词</span></button>
        <button class="node-tool" data-add="image"><span class="node-icon">图</span><span>图片素材</span></button>
        <button class="node-tool" data-add="video-generator"><span class="node-icon">✦</span><span>视频生成</span></button>
      </div>
      <div class="hint"><strong>操作提示</strong><p>拖拽节点标题移动；从右侧端口点击源节点，再点击目标节点完成连线；空白处拖动平移。</p></div>
    </aside>
    <main class="canvas-shell">
      <div id="viewport"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div></div>
      <div id="minimap" class="minimap"></div>
      <div class="canvas-controls">
        <button class="tool" id="zoomOut">−</button><span id="zoomLabel" class="zoom-label">100%</span><button class="tool" id="zoomIn">+</button><button class="tool" id="fitBtn">适配</button>
      </div>
    </main>
    <aside class="right">
      <h3>属性检查器</h3>
      <div id="inspector"></div>
    </aside>
  </div>
  <div class="prototype-badge">PROTOTYPE · 本地原型</div>
  <div id="nodeMenu" class="context-menu" role="menu">
    <button data-command="copy"><span class="menu-icon">▣</span>复制<kbd>Ctrl+C</kbd></button>
    <button data-command="paste"><span class="menu-icon">▤</span>粘贴<kbd>Ctrl+V</kbd></button>
    <hr>
    <button data-command="delete" class="danger-item"><span class="menu-icon">✕</span>删除<kbd>Del</kbd></button>
  </div>
  <div id="canvasMenu" class="context-menu" role="menu">
    <button data-command="undo"><span class="menu-icon">↶</span>撤销<kbd>Ctrl+Z</kbd></button>
    <button data-command="redo"><span class="menu-icon">↷</span>重做<kbd>Ctrl+Y</kbd></button>
    <hr>
    <button data-command="paste"><span class="menu-icon">▤</span>粘贴<kbd>Ctrl+V</kbd></button>
  </div>
  <div id="edgeDeleteHint" class="edge-delete-hint">✕ 点击删除连接</div>
  <div id="copyFallback" class="copy-fallback"><div class="copy-fallback-card"><strong>请手动复制提示词</strong><p>浏览器没有授予剪贴板权限，请从下方手动复制。</p><textarea id="copyFallbackText" readonly></textarea><div class="copy-fallback-actions"><button class="btn" id="selectFallback">全选文本</button><button class="btn primary" id="closeFallback">完成</button></div></div></div>
  <div id="toast" class="toast"></div>
  <script>
    const $=s=>document.querySelector(s);
    const seed={name:'爱弥斯·现实约会',view:{x:22,y:118,scale:.52},nodes:[
      {id:'n1',type:'text',title:'场景提示词',x:100,y:130,content:'夕阳河岸，真人手机实拍，爱弥斯保持纯二次元赛璐璐形象。'},
      {id:'n2',type:'image',title:'角色参考',x:460,y:70,content:'爱弥斯·约会服三视图'},
      {id:'n3',type:'video-generator',title:'Seedance 镜头生成',x:820,y:190,content:'轻微手持晃动，爱弥斯回头望向镜头',model:'Seedance 2.0 Mini',ratio:'9:16',duration:5},
      {id:'n4',type:'video-generator',title:'镜头 03 · 河岸回头',x:1190,y:130,content:'以 @图片1 为角色参考，保持二次元赛璐璐形象',model:'Seedance 2.0 Mini',ratio:'9:16',duration:5}
    ],edges:[{from:'n1',to:'n3'},{from:'n2',to:'n3'},{from:'n3',to:'n4'}]};
    const projectsKey='mirrorflow-projects-v1',migrationKey='mirrorflow-files-migrated-v1';
    let workspace={currentProjectId:null,projects:[]},currentProjectId=null,state=normalizeState(seed),selected=null,connectFrom=null,connectDrag=null,resize=null,drag=null,pan=null,saveTimer=null,saveQueue=Promise.resolve(),clipboard=null,undoStack=[],redoStack=[],historyTimer=null,menuPoint={x:innerWidth/2,y:innerHeight/2},ready=false,switching=false;
    function clone(v){return JSON.parse(JSON.stringify(v))}
    function projectId(){return `p-${Date.now()}-${Math.random().toString(36).slice(2,7)}`}
    async function api(path,options={}){let response;try{response=await fetch(path,options)}catch{throw new Error('无法连接本地服务，请在项目目录运行 npm run dev 后刷新页面')}let body=null;try{body=await response.json()}catch{}if(!response.ok)throw new Error(body?.error||`请求失败（${response.status}）`);return body}
    function legacyWorkspace(){try{const stored=JSON.parse(localStorage.getItem(projectsKey));if(stored?.projects?.length)return stored;const legacy=JSON.parse(localStorage.getItem('mirrorflow-canvas'));if(legacy){const id=projectId();return{currentProjectId:id,projects:[{id,data:legacy}]}}}catch{}return null}
    async function initialize(){try{$('#saveState').textContent='正在读取项目文件…';workspace=await api('/api/projects');if(!workspace.projects.length){const legacy=localStorage.getItem(migrationKey)?null:legacyWorkspace();if(legacy?.projects?.length){$('#saveState').textContent='正在迁移旧项目…';const projects=[];for(const project of legacy.projects){const data=await migrateLegacyImages(normalizeState(project.data));projects.push({id:project.id,data})}workspace=await api('/api/projects/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projects,currentProjectId:legacy.currentProjectId})});localStorage.setItem(migrationKey,new Date().toISOString());toast(`已迁移 ${projects.length} 个旧项目`)}else{const id=projectId(),data=normalizeState(seed);await putProject(id,data);workspace=await api('/api/projects');workspace.currentProjectId=id}}currentProjectId=workspace.currentProjectId&&workspace.projects.some(project=>project.id===workspace.currentProjectId)?workspace.currentProjectId:workspace.projects[0].id;state=normalizeState(await api(`/api/projects/${encodeURIComponent(currentProjectId)}`));ready=true;render();$('#saveState').textContent='已保存为项目文件'}catch(error){$('#saveState').textContent='项目文件读取失败';toast(error.message||'初始化失败')}}
    async function migrateLegacyImages(data){for(const node of data.nodes){if(node.type==='image'&&node.imageData&&!node.imageUrl){node.imageUrl=await uploadDataUrl(node.imageData);delete node.imageData}}return data}
    async function uploadDataUrl(dataUrl){const response=await fetch(dataUrl),blob=await response.blob();return uploadImageBlob(blob)}
    async function uploadImageBlob(blob){const uploaded=await api('/api/assets',{method:'POST',headers:{'Content-Type':blob.type||'image/webp'},body:blob});return uploaded.url}
    async function putProject(id,data){return api(`/api/projects/${encodeURIComponent(id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}
    function currentProject(){return workspace.projects.find(project=>project.id===currentProjectId)}
    function renderProjects(){const select=$('#projectSelect');select.innerHTML=workspace.projects.map(project=>`<option value="${esc(project.id)}">${esc(project.name||'未命名项目')}</option>`).join('');select.value=currentProjectId;select.disabled=switching}
    async function persistCurrent(){if(!ready||!currentProjectId)return;const data=clone(state),id=currentProjectId;await putProject(id,data);const project=workspace.projects.find(item=>item.id===id);if(project)project.name=data.name||'未命名项目';workspace.currentProjectId=id}
    async function flushSave(){clearTimeout(saveTimer);saveTimer=null;saveQueue=saveQueue.catch(()=>{}).then(()=>persistCurrent());try{await saveQueue;renderProjects();$('#saveState').textContent='已保存为项目文件'}catch(error){$('#saveState').textContent='项目文件保存失败';toast(error.message||'保存失败');throw error}}
    async function switchProject(id){if(switching||id===currentProjectId||!workspace.projects.some(project=>project.id===id))return;switching=true;renderProjects();try{await flushSave();currentProjectId=id;state=normalizeState(await api(`/api/projects/${encodeURIComponent(id)}`));await putProject(id,state);workspace.currentProjectId=id;selected=connectFrom=connectDrag=resize=drag=pan=null;undoStack=[];redoStack=[];render();toast(`已切换到“${state.name}”`)}catch(error){toast(error.message||'项目切换失败')}finally{switching=false;renderProjects()}}
    async function createProject(){if(switching)return;switching=true;renderProjects();try{await flushSave();const id=projectId(),index=workspace.projects.length+1,data=normalizeState({name:`新项目 ${index}`,view:{x:80,y:80,scale:1},nodes:[],edges:[]});await putProject(id,data);workspace.projects.push({id,name:data.name});workspace.currentProjectId=currentProjectId=id;state=data;selected=connectFrom=connectDrag=resize=drag=pan=null;undoStack=[];redoStack=[];render();toast('新项目已创建')}catch(error){toast(error.message||'新建项目失败')}finally{switching=false;renderProjects()}}
    function normalizeState(input){const next=clone(input||seed);next.name=next.name||'未命名项目';next.view=next.view||{x:80,y:80,scale:1};next.edges=Array.isArray(next.edges)?next.edges:[];next.nodes=(next.nodes||[]).map(node=>{if(node.type==='video'||node.type==='generator')node.type='video-generator';if(node.type==='video-generator'){node.model=node.model||'Seedance 2.0 Mini';node.ratio=node.ratio||'9:16';node.duration=Math.min(10,Math.max(4,Number(node.duration)||5))}node.width=Math.max(180,Number(node.width)||260);node.height=Math.max(120,Number(node.height)||(node.type==='image'?imagePreviewHeight(node)+117:150));return node});return next}

    $('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download=(state.name||'canvas')+'.json';a.click();URL.revokeObjectURL(a.href)};
    $('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{try{checkpoint();const imported=await migrateLegacyImages(normalizeState(JSON.parse(await e.target.files[0].text())));state=imported;selected=null;render();await flushSave();toast('导入成功，已保存到当前项目文件')}catch(error){toast(error.message||'JSON 格式无效')}};
    $('#imageFileInput').onchange=async e=>{const file=e.target.files[0],node=state.nodes.find(n=>n.id===selected);if(!file||!node)return;try{$('#saveState').textContent='正在保存图片资源…';const image=await prepareImage(file),imageUrl=await uploadImageBlob(image.blob);checkpoint();node.imageUrl=imageUrl;delete node.imageData;node.imageWidth=image.width;node.imageHeight=image.height;node.fileName=file.name;node.title=file.name;node.content=`${file.name} · ${image.width}×${image.height}`;render();await flushSave();toast('图片资源与项目文件已保存')}catch(error){toast(error.message||'图片导入失败')}};
    $('#selectFallback').onclick=()=>{$('#copyFallbackText').focus();$('#copyFallbackText').select()};$('#closeFallback').onclick=()=>$('#copyFallback').classList.remove('open');
    document.addEventListener('contextmenu',e=>{const node=e.target.closest('.node');if(!node&&!e.target.closest('#viewport'))return;e.preventDefault();menuPoint={x:e.clientX,y:e.clientY};if(node){selected=node.dataset.id;renderInspector();document.querySelectorAll('.node').forEach(item=>item.classList.toggle('selected',item.dataset.id===selected));showMenu($('#nodeMenu'),e.clientX,e.clientY)}else{selected=null;renderInspector();showMenu($('#canvasMenu'),e.clientX,e.clientY)}});
    document.addEventListener('pointerdown',e=>{if(e.target.closest('.context-menu'))return;if(e.button!==2)hideMenus()},true);
    window.addEventListener('blur',hideMenus);window.addEventListener('resize',hideMenus);
    document.addEventListener('keydown',e=>{const editing=['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable,mod=e.ctrlKey||e.metaKey,key=e.key.toLowerCase();if(editing){if(e.key==='Escape')hideMenus();return}if(mod&&key==='c'){e.preventDefault();copyNode()}else if(mod&&key==='v'){e.preventDefault();menuPoint={x:innerWidth/2,y:innerHeight/2};pasteNode()}else if(mod&&key==='z'&&e.shiftKey){e.preventDefault();redo()}else if(mod&&key==='z'){e.preventDefault();undo()}else if(mod&&key==='y'){e.preventDefault();redo()}else if((e.key==='Delete'||e.key==='Backspace')&&selected)deleteSelected();else if(e.key==='Escape')hideMenus()});
    window.addEventListener('beforeunload',()=>{if(!ready||!currentProjectId)return;fetch(`/api/projects/${encodeURIComponent(currentProjectId)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state),keepalive:true}).catch(()=>{})});
    initialize();
  </script>
</body>
</html>
